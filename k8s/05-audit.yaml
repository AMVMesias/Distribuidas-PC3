apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: cavalocal
spec:
  selector:
    app: audit-service
  ports:
    - name: http
      port: 3002
      targetPort: 3002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: cavalocal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -U postgres -d cavalocal_audit; do sleep 2; done"]
        - name: migrate
          image: cavalocal-audit:local
          imagePullPolicy: IfNotPresent
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cavalocal-secrets
                  key: AUDIT_DATABASE_URL
      containers:
        - name: audit-service
          image: cavalocal-audit:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: cavalocal-config
          env:
            - name: PORT
              value: "3002"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cavalocal-secrets
                  key: AUDIT_DATABASE_URL
          resources:
            requests:
              cpu: 75m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: 3002
            failureThreshold: 30
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3002
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3002
            periodSeconds: 15
