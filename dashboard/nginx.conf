server {
  listen 8080;
  server_name _;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /dashboard {
    return 301 /dashboard/;
  }

  location /dashboard/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /dashboard/index.html;
  }
}
